        formula: "$d = \\frac{|\\bar{X}_1 - \\bar{X}_2|}{s_{\\text{pooled}}}, \\quad s_{\\text{pooled}} = \\sqrt{\\frac{(N_1-1)s_1^2 + (N_2-1)s_2^2}{N_1+N_2-2}}$"
      - id: "EQ-129"
