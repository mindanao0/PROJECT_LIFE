version: "10.2.2"
total_equations: 300

domains:
  - domain: "DOMAIN-01"
    name: "Offline-First & Determinism Foundations"
    equations:
      - id: "EQ-001"
        name: "Air-Gap Network Independence"
        formula: "I(Engine; External_Network) = 0"
      - id: "EQ-002"
        name: "Deterministic Seed Recurrence"
        formula: "S_{t+1} = (a S_t + c) mod m"
      - id: "EQ-003"
        name: "Canonical SHA-256 Digest"
        formula: "H^{(i)} = f(H^{(i-1)}, M_i)"
      - id: "EQ-004"
        name: "Unicode NFC Invariant"
        formula: "NFC(NFC(S)) = NFC(S)"
      - id: "EQ-005"
        name: "RFC3339 UTC Timestamps"
        formula: "t_1 < t_2 <=> FormatUTC(t_1) <_lex FormatUTC(t_2)"
      - id: "EQ-006"
        name: "Exact Decimal Serialization"
        formula: "d = (-1)^s x m x 10^e"
      - id: "EQ-007"
        name: "Canonical JSON Ordering"
        formula: "KeyOrder(K_1, K_2) = strcmp(K_1, K_2)"
      - id: "EQ-008"
        name: "Bit-Identical Replay R4"
        formula: "Pr(Digest_1 = Digest_2 | Seed) = 1.0"
      - id: "EQ-009"
        name: "FSM Logical Determinism R1"
        formula: "S_FSM(Run_1) === S_FSM(Run_2)"
      - id: "EQ-010"
        name: "Environment Digest Hash"
        formula: "H_env = SHA-256(Kernel || CPU || Python)"

  - domain: "DOMAIN-02"
    name: "Concurrency & Single-Writer Coordinator"
    equations:
      - id: "EQ-011"
        name: "Single-Writer Invariant"
        formula: "|{W | WritePerm(W, DB) = 1}| === 1"
      - id: "EQ-012"
        name: "Worker DB Isolation"
        formula: "FD(w) intersect FD(DB) = empty"
      - id: "EQ-013"
        name: "Immutable Task Snapshot"
        formula: "H_task = SHA-256(Source || Seed || Params)"
      - id: "EQ-014"
        name: "IPC Ring Buffer Arithmetic"
        formula: "Head_{t+1} = (Head_t + 1) mod N"
      - id: "EQ-015"
        name: "Idempotent Task Handler"
        formula: "f(f(Task)) === f(Task)"
      - id: "EQ-016"
        name: "Amdahl Worker Scaling"
        formula: "S(p) = 1 / ((1 - s) + s / p)"
      - id: "EQ-017"
        name: "Little's Law Queue Backpressure"
        formula: "L = lambda * W <= Q_max"
      - id: "EQ-018"
        name: "Heartbeat Exponential Decay"
        formula: "P_alive(t) = exp(-lambda_hb * Delta t)"
      - id: "EQ-019"
        name: "Worker Timeout Pruning"
        formula: "Kill(w) <=> Delta t > 5.0 s"
      - id: "EQ-020"
        name: "Zero-Lock WAL Concurrency"
        formula: "Pr(LockContention) = 0.0"

  - domain: "DOMAIN-11"
    name: "Multi-Objective Pareto Dominance & Fast Sorting"
    equations:
      - id: "EQ-101"
        name: "Strict Pareto Dominance"
        formula: "x >- y <=> (forall i, f_i(x) >= f_i(y)) and (exists j, f_j(x) > f_j(y))"
      - id: "EQ-102"
        name: "Fast Non-dominated Sort"
        formula: "Complexity = O(M * N^2)"
      - id: "EQ-103"
        name: "Pareto Front Rank"
        formula: "Rank(x) = 1 + |{y | y >- x}|"
      - id: "EQ-104"
        name: "Direction Inversion"
        formula: "bar{f}_i(x) = -f_i(x) <=> Direction(i) = MIN"
      - id: "EQ-105"
        name: "Convex Hull Preservation"
        formula: "H(S) = Conv({f(x) | x in S})"
      - id: "EQ-106"
        name: "Hypervolume Indicator"
        formula: "HV(S, r) = Lambda(Union product [f_i(x), r_i])"
      - id: "EQ-107"
        name: "Crowding Distance NSGA-II"
        formula: "I[i]_dist = I[i]_dist + (f_m(i+1) - f_m(i-1))/(f_m^max - f_m^min)"
      - id: "EQ-108"
        name: "Inverted Generational Distance Plus"
        formula: "IGD+(P, P*) = (1 / |P*|) * sum min d+(u, v)"
      - id: "EQ-109"
        name: "Zero-Weight Dominance Isolation"
        formula: "Pr(Dominated(x, y) | w) === Pr(Dominated(x, y))"
      - id: "EQ-110"
        name: "Deterministic Tie-Breaking"
        formula: "TieBreak(x, y) = strcmp(Hash(x), Hash(y))"

  - domain: "DOMAIN-24"
    name: "Cryptographic Trust (EE-CRYPTO-1, Ed25519)"
    equations:
      - id: "EQ-231"
        name: "EE-CRYPTO-1 Profile Tuple"
        formula: "<Ed25519, SHA-256, Raw32, Raw64>"
      - id: "EQ-232"
        name: "Ed25519 Curve Equation"
        formula: "-x^2 + y^2 = 1 + d*x^2*y^2 (mod 2^{255}-19)"
      - id: "EQ-233"
        name: "Zero Negotiation Guard"
        formula: "|AllowedAlgos| === 1"
      - id: "EQ-234"
        name: "2-of-3 Multisig Quorum"
        formula: "sum VerifySig(K_i, M, S_i) >= 2"
      - id: "EQ-235"
        name: "Nonce Entropy Bound"
        formula: "H(Nonce) >= 128 bits"
      - id: "EQ-236"
        name: "Schnorr RFC 8032 Verification"
        formula: "S * B = R + k * A (mod l)"
      - id: "EQ-237"
        name: "Key ID SHA-256 Hash"
        formula: "KeyID = SHA-256(PublicKeyBytes)"
      - id: "EQ-238"
        name: "Ceremony Witness Hash"
        formula: "H_ceremony = SHA-256(product K_witness)"
      - id: "EQ-239"
        name: "Key Revocation Invariant"
        formula: "KeyID not in RevocationList"
      - id: "EQ-240"
        name: "Merkle Hash Chain Recurrence"
        formula: "H_i = SHA-256(H_{i-1} || EventBytes_i || Seq_i)"

  - domain: "DOMAIN-30"
    name: "Governance, Ethics, IP & Self-Evolution (M13)"
    equations:
      - id: "EQ-291"
        name: "Requirement Formal Lifecycle"
        formula: "Status in {REQ, IMP, TEST, EVID}"
      - id: "EQ-292"
        name: "179 Monotonic Requirements"
        formula: "|R| === 179, Index(R_k) = k"
      - id: "EQ-293"
        name: "Multi-Party Quorum Review"
        formula: "|Approvers| >= 2 land Author not in Approvers"
      - id: "EQ-294"
        name: "Traceability Bijection"
        formula: "forall r, |Tests(r)| >= 1 land |Evidence(r)| >= 1"
      - id: "EQ-295"
        name: "License Conformance"
        formula: "License === 'Apache-2.0'"
      - id: "EQ-296"
        name: "IP Provenance Match Bound"
        formula: "Match(MutatedCode, GPL_Database) < 0.10"
      - id: "EQ-297"
        name: "Green Computing Energy Efficiency"
        formula: "eta_green = Generations / Joules >= eta_min"
      - id: "EQ-298"
        name: "Price's Selection Equation"
        formula: "Delta bar{z} = (1/w) * Cov(w_i, z_i) + (1/w) * E(w_i * Dz_i)"
      - id: "EQ-299"
        name: "Frozen Root-of-Trust Evaluator"
        formula: "SHA-256(Evaluator_cand) === SHA-256(Evaluator_genesis)"
      - id: "EQ-300"
        name: "Maturity Monotonic Closure"
        formula: "M_0 -> M_1 -> ... -> M_{13} (Complete Self-Evolution)"
