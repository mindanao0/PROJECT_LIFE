[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-engine"
version = "10.2.2"
description = "Next-Generation Autonomous Population-Based Evolutionary Software Optimization Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "Evolution Engine Architecture Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "jsonschema>=4.20.0",
    "libcst>=1.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.20.0",
    "jsonschema-rs>=0.20.0",
    "pyyaml>=6.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.90.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
    "pre-commit>=3.6.0"
]
research = [
    "torch>=2.2.0",
    "qiskit>=1.0.0"
]

[project.scripts]
evolve = "evolution_engine.cli:main"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "C4", "UP", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Sandbox and security tests",
    "golden: Golden corpus conformance tests",
    "property_based: Hypothesis property-based tests"
]
