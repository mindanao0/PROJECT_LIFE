version: "10.2.2"
total_linters: 20

linters:
  - linter_id: "LINT-01"
    name: "ClosedWorldSchemaLinter"
    target: "schemas/*.schema.json"
    rule: "Ensure all schemas have additionalProperties: false and draft 2020-12 meta-schema"
    severity: "BLOCKER"

  - linter_id: "LINT-02"
    name: "MonotonicTraceabilityLinter"
    target: "docs/10_governance_and_roadmap/REQUIREMENTS_TRACEABILITY.md"
    rule: "Verify exactly 179 monotonic requirement IDs without gaps or duplicates"
    severity: "BLOCKER"

  - linter_id: "LINT-03"
    name: "FsmStateCompletenessLinter"
    target: "docs/02_fsm_and_lifecycles/*.md"
    rule: "Verify all 57 states across 5 FSMs have valid transitions and no deadlocks"
    severity: "BLOCKER"

  - linter_id: "LINT-04"
    name: "SqlTriggerIntegrityLinter"
    target: "docs/03_storage_and_database/INTEGRITY_TRIGGERS.md"
    rule: "Validate polymorphic reference triggers and gapless sequence checks"
    severity: "BLOCKER"

  - linter_id: "LINT-05"
    name: "DecimalFormatLinter"
    target: "docs/domains/*.md"
    rule: "Ensure no IEEE 754 float expressions are serialized without scale bounds"
    severity: "BLOCKER"

  - linter_id: "LINT-06"
    name: "SeccompMatrixCoverageLinter"
    target: "docs/06_security_and_sandboxing/SECCOMP_BPF_FILTERING.md"
    rule: "Verify all 6 prohibited syscall categories are covered by kill filters"
    severity: "BLOCKER"

  - linter_id: "LINT-07"
    name: "BitIdenticalReplayLinter"
    target: "docs/01_architecture/VISION_AND_PRINCIPLES.md"
    rule: "Assert R4 bit-identical determinism requirement is enforced across all runners"
    severity: "BLOCKER"

  - linter_id: "LINT-08"
    name: "MaturityGatesClosureLinter"
    target: "spec/maturity.yaml"
    rule: "Verify all release gates M0 to M13 are monotonically ordered"
    severity: "BLOCKER"

  - linter_id: "LINT-09"
    name: "StateVocabularyConsistencyLinter"
    target: "spec/fsm_states_57.yaml, schemas/*.schema.json, docs/**/SQLITE_DDL_TABLES.md"
    rule: "Every FSM state vocabulary must be byte-identical across spec/fsm_states_57.yaml, the JSON Schema enums and the SQLite CHECK constraints. Enforces REQ-S13-004 (mismatch = CI failure)."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-10"
    name: "EvidenceRetentionLinter"
    target: "docs/**/*.md (SQL DDL blocks)"
    rule: "audit_events, evidence_records, quarantine_records and recovery_records must never be reachable by ON DELETE CASCADE. Enforces REQ-S01-009 (Never Destroy Audit History)."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-11"
    name: "GoldenCorpusManifestLinter"
    target: "benchmarks/golden/**"
    rule: "benchmarks/golden/manifest.yaml is the canonical corpus registry. Directory names, project.yaml fields and expected dispositions must all agree with it, and every disposition must be a declared FSM terminal state. Enforces REQ-S16-001."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-12"
    name: "RetiredStateNameLinter"
    target: "spec/ACTIVE_CONTRACT.md, docs/**/*.md, spec/*.yaml, schemas/*.json"
    rule: "No state name retired from spec/fsm_states_57.yaml may still appear as a state token in prose, YAML or JSON. Catches the narrative-vs-DDL drift that LINT-09 alone does not see."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-13"
    name: "CiJobNameResolutionLinter"
    target: "spec/release_gates.yaml, tools/ci_matrix.yaml, spec/maturity.yaml"
    rule: "Every mandatory_check and every pipeline job must name a job declared in Active Contract section 21, every section-21 job must appear in a stage, and no release gate may require a maturity level that is itself defined by passing that gate. Enforces REQ-S21-002."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-14"
    name: "DeclaredCountLinter"
    target: "spec/version_manifest.yaml, spec/traceability.yaml, tools/spec_linters.yaml"
    rule: "Every count declared in spec/version_manifest.yaml subsystems must equal the number actually present in the repo (schemas, protocols, tables, indices, FSMs, states, corpus cases, requirements, CI jobs, linters), and traceability entry counts must match the Active Contract."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-15"
    name: "ConfigExampleValidationLinter"
    target: "docs/**/*.md, spec/ACTIVE_CONTRACT.md, schemas/26_engine_config.schema.json"
    rule: "Every evolution.yaml example printed anywhere in the repo must validate against schemas/26_engine_config.schema.json, so an example copied by a user cannot be rejected by `evolve validate`."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-16"
    name: "EquationDimensionRegistryLinter"
    target: "spec/equations_300.yaml, spec/dimensions_300.yaml, docs/**/*.md"
    rule: "Both registries must contain every EQ and DIM referenced anywhere in the docs, declare counts equal to their entry counts, use a single zero-padding convention, and every dimension must map to an equation that exists."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-17"
    name: "RequirementRegisterAndFsmSpecLinter"
    target: "spec/requirements.yaml, spec/traceability.yaml, spec/fsm/*.yaml"
    rule: "spec/requirements.yaml must cover every requirement in the Active Contract with all REQ-S02-008 fields and digests identical to spec/traceability.yaml, and spec/fsm/*.yaml must exist for all five FSMs, agree with spec/fsm_states_57.yaml and keep terminal states edge-free."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-18"
    name: "ArchiveIntegrityAndRetiredIdLinter"
    target: "spec/archive/, spec/requirements.yaml, spec/change_records/"
    rule: "The recovered historical archive must hash to the value recorded in spec/archive/manifest.json, no retired requirement ID may reappear in the Active Contract, and every retirement must cite an existing change record. Enforces REQ-S00-009 and Section 2.4 immutability."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-19"
    name: "CoreResearchFirewallLinter"
    target: "benchmarks/golden/manifest.yaml, spec/release_gates.yaml, spec/maturity.yaml"
    rule: "Every golden corpus case must declare a maturity_bucket, and nothing in the Core path — GATE_CORE or a Core maturity rung — may require a case in the RESEARCH bucket. Enforces the section 3.1 / section 26 Core-Research firewall."
    implementation: "tools/lint_state_vocabulary.py"
    severity: "BLOCKER"

  - linter_id: "LINT-20"
    name: "EarnedMaturityLinter"
    target: "spec/version_manifest.yaml, spec/maturity.yaml, tools/compute_maturity.py"
    rule: "The declared current_maturity_level must equal the level tools/compute_maturity.py derives from real artifacts. Every other count in this repo is derived and linted; the project's own progress marker must be too. Enforces REQ-S28-002."
    implementation: "tools/compute_maturity.py"
    severity: "BLOCKER"
